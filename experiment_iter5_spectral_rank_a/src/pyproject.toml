[project]
name = "spectral-rank-analysis-fk-aggregation"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
description = "Spectral Rank Analysis at FK Aggregation: Measuring Information Compression Across 3 Contrasting Tasks"
dependencies = [
    "torch==2.4.1",
    "torch-geometric==2.7.0",
    "torch-scatter==2.1.2",
    "torch-sparse==0.6.18",
    "torch-cluster==1.6.3",
    "pyg-lib==0.4.0",
    "pytorch-frame==0.3.0",
    "relbench==1.0.1",
    "scipy==1.15.3",
    "loguru==0.7.3",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "tensorboard==2.20.0",
]

[tool.uv]
# PyTorch CUDA 12.4 wheels
extra-index-url = [
    "https://download.pytorch.org/whl/cu124",
    "https://data.pyg.org/whl/torch-2.4.0+cu124.html",
]
